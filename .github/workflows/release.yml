# v* etiketi push edilince üç platform için paketler ve GitHub Releases'a yükler.
# Uygulama içi güncelleme bu sürümleri okur. Yeni sürüm: `npm run release`
name: Sürüm

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Windows'ta varsayılan PowerShell, `-c.npmRebuild=false` argümanını noktadan böler.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Etiket package.json sürümüyle aynı mı
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Paralel derlemeler aynı sürüme yüklesin diye sürümü önce oluştur.
      - run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64 -c.npmRebuild=false
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
